<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">The cartoon style, measured frame by frame: moving camera, stepped poses, plum ink outlines, word-by-word captions, and the audio mix</title>
  <desc id="d">Five panels. A camera viewfinder creeps over a hillside. A character snaps between held poses while a frame counter ticks. A round white head shows its plum outline growing from 3 to 7 percent of the head. A phone swaps one to three word captions at 70 percent height. Audio bars show the voice at minus 14 LUFS, music 22 to 25 dB under it with no ducking, and sound-effect hits.</desc>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .cap{font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:900;fill:#fff;stroke:#0d070c;paint-order:stroke;stroke-linejoin:round}
    .ink{stroke:#2c1821;stroke-linecap:round;stroke-linejoin:round}

    /* panel 1: camera */
    .cam{transform-origin:122px 210px;animation:cam 7s ease-in-out infinite alternate}
    @keyframes cam{from{transform:scale(1) translate(8px,2px)}to{transform:scale(1.22) translate(-10px,-6px)}}
    .rec{animation:rec 1s step-end infinite}
    @keyframes rec{50%{opacity:0}}
    .cl{animation:cl 7s linear infinite alternate}
    @keyframes cl{to{transform:translateX(26px)}}

    /* panel 2: stepped poses, holds of 6, 3, 12, 4 frames (30 fps) */
    .q0{animation:q0 .833s step-end infinite}.q1{animation:q1 .833s step-end infinite}.q2{animation:q2 .833s step-end infinite}.q3{animation:q3 .833s step-end infinite}
    @keyframes q0{0%{opacity:1}24%{opacity:0}}
    @keyframes q1{0%{opacity:0}24%{opacity:1}36%{opacity:0}}
    @keyframes q2{0%{opacity:0}36%{opacity:1}84%{opacity:0}}
    @keyframes q3{0%{opacity:0}84%{opacity:1}}
    .fr{animation:fr .833s steps(25,end) infinite}
    @keyframes fr{from{transform:translateX(0)}to{transform:translateX(175px)}}

    /* panel 3: outline weight */
    .ol{animation:ol 4s step-end infinite}
    @keyframes ol{0%{stroke-width:3}33%{stroke-width:5}66%{stroke-width:7}}
    .w3{animation:w3 4s step-end infinite}.w5{opacity:0;animation:w5 4s step-end infinite}.w7{opacity:0;animation:w7 4s step-end infinite}
    @keyframes w3{0%{opacity:1}33%{opacity:0}100%{opacity:0}}
    @keyframes w5{0%{opacity:0}33%{opacity:1}66%{opacity:0}}
    @keyframes w7{0%{opacity:0}66%{opacity:1}100%{opacity:1}}
    .head{animation:head 4s ease-in-out infinite alternate;transform-origin:590px 214px}
    @keyframes head{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}

    /* panel 4: captions */
    .c{opacity:0;animation:c 4.8s step-end infinite}
    .c0{opacity:1}.c1{animation-delay:-4.2s}.c2{animation-delay:-3.6s}.c3{animation-delay:-3s}.c4{animation-delay:-2.4s}.c5{animation-delay:-1.8s}.c6{animation-delay:-1.2s}.c7{animation-delay:-.6s}
    @keyframes c{0%{opacity:1}12.5%{opacity:0}100%{opacity:0}}
    .ph{transform-origin:830px 220px;animation:ph 4.8s ease-in-out infinite alternate}
    @keyframes ph{from{transform:scale(1.04)}to{transform:scale(1.14) translateY(-3px)}}

    /* panel 5: mix */
    .v rect{transform-box:fill-box;transform-origin:center;animation:v .9s ease-in-out infinite alternate}
    @keyframes v{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
    .m rect{transform-box:fill-box;transform-origin:center;animation:m 2.4s ease-in-out infinite alternate}
    @keyframes m{from{transform:scaleY(.7)}to{transform:scaleY(1)}}
    .hit{transform-box:fill-box;transform-origin:center bottom;animation:hit 2.2s infinite}
    @keyframes hit{0%{transform:scaleY(0)}4%{transform:scaleY(1)}22%{transform:scaleY(.15)}40%{transform:scaleY(0)}100%{transform:scaleY(0)}}
    .scan{animation:scan 4.4s linear infinite}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(186px)}}

    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160c1b"/>
      <stop offset="1" stop-color="#2b1430"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9ec9"/>
      <stop offset="1" stop-color="#ffd9b0"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b5c8a"/>
      <stop offset="1" stop-color="#5c8fbd"/>
    </linearGradient>
    <clipPath id="vf"><rect x="28" y="148" width="188" height="150" rx="6"/></clipPath>
    <clipPath id="scr"><rect x="790" y="140" width="84" height="150" rx="8"/></clipPath>
    <g id="guy">
      <path class="ink" d="M-6 0L-5-40M6 0L5-40M-7 0h-5M7 0h5" stroke-width="3.5" fill="none"/>
      <rect class="ink" x="-13" y="-80" width="26" height="44" rx="13" fill="#fbfaf5" stroke-width="3"/>
      <path d="M0-76l-3 4 3 22 3-22z" fill="#b5652a" stroke="#2c1821" stroke-width="1.4" stroke-linejoin="round"/>
      <circle class="ink" cx="0" cy="-99" r="17" fill="#fbfaf5" stroke-width="3"/>
      <path class="ink" d="M-16-103a16 15 0 0 1 32 0q-8-6-16-5t-16 5z" fill="#6b3b22" stroke-width="2.4"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <text x="60" y="58" class="sans" font-size="13" font-weight="700" letter-spacing="2.6" fill="#ff8fc8">THE LOOK, MEASURED</text>
  <text x="58" y="98" class="cap" font-size="32" stroke-width="8">STUDIED FRAME BY FRAME.</text>
  <text x="1140" y="62" text-anchor="end" class="sans" font-size="14" fill="#c8afc1">3 reference Shorts read at 10 fps end to end</text>
  <text x="1140" y="84" text-anchor="end" class="sans" font-size="14" fill="#c8afc1">and at 30 fps on every join and effect</text>

  <!-- panel frames -->
  <g fill="#1f1124" stroke="#43284a" stroke-width="1.5">
    <rect x="16" y="124" width="212" height="276" rx="14"/>
    <rect x="250" y="124" width="212" height="276" rx="14"/>
    <rect x="484" y="124" width="212" height="276" rx="14"/>
    <rect x="718" y="124" width="212" height="276" rx="14"/>
    <rect x="952" y="124" width="232" height="276" rx="14"/>
  </g>

  <!-- 1 camera -->
  <g clip-path="url(#vf)">
    <g class="cam">
      <rect x="10" y="130" width="230" height="190" fill="url(#sky)"/>
      <g class="cl" fill="#fff" opacity=".85"><circle cx="60" cy="176" r="12"/><circle cx="76" cy="170" r="15"/><circle cx="92" cy="178" r="10"/><circle cx="170" cy="168" r="10"/><circle cx="182" cy="164" r="12"/></g>
      <ellipse cx="70" cy="262" rx="90" ry="34" fill="#7cc46b"/>
      <ellipse cx="190" cy="268" rx="90" ry="40" fill="#5fae55"/>
      <rect x="10" y="270" width="230" height="40" fill="#56a84a"/>
      <use href="#guy" xlink:href="#guy" transform="translate(120 290) scale(.6)"/>
      <g transform="translate(120 290) scale(.6)"><path class="ink" d="M-12-70l-6 22M12-70l6 22" stroke-width="3.5" fill="none"/><circle cx="-18" cy="-46" r="3.6" fill="#2c1821"/><circle cx="18" cy="-46" r="3.6" fill="#2c1821"/><path class="ink" d="M-9-97h6M3-97h6M-3-88q4 2 7-1" stroke-width="1.8" fill="none"/></g>
    </g>
  </g>
  <g stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M38 168v-10h12M206 168v-10h-12M38 278v10h12M206 278v10h-12"/>
  </g>
  <rect x="42" y="164" width="40" height="16" rx="8" fill="#000" opacity=".55"/>
  <circle class="rec" cx="50" cy="172" r="4" fill="#ff3b5c"/>
  <text x="58" y="176" class="mono" font-size="10" fill="#fff" font-weight="700">REC</text>
  <g class="sans">
    <text x="122" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#fbfaf5">Camera never still</text>
    <text x="122" y="352" text-anchor="middle" font-size="12" fill="#bfa6b8">every shot already moving</text>
    <text x="122" y="368" text-anchor="middle" font-size="12" fill="#bfa6b8">on frame 1 · dissolves of</text>
    <text x="122" y="384" text-anchor="middle" font-size="12" fill="#bfa6b8">4–12 frames between sets</text>
  </g>

  <!-- 2 stepped poses -->
  <rect x="262" y="148" width="188" height="150" rx="6" fill="url(#room)"/>
  <rect x="262" y="260" width="188" height="38" fill="#3f6d97"/>
  <g transform="translate(356 284) scale(.86)">
    <use href="#guy" xlink:href="#guy"/>
    <g class="q0"><path class="ink" d="M-12-70l-6 22M12-70l6 22" stroke-width="3.5" fill="none"/><circle cx="-18" cy="-46" r="3.6" fill="#2c1821"/><circle cx="18" cy="-46" r="3.6" fill="#2c1821"/><path class="ink" d="M-9-97h6M3-97h6M-3-88h6" stroke-width="1.8"/></g>
    <g class="q1" opacity="0"><path class="ink" d="M-12-70l-20-6M12-70l20-6" stroke-width="3.5" fill="none"/><circle cx="-33" cy="-76" r="3.6" fill="#2c1821"/><circle cx="33" cy="-76" r="3.6" fill="#2c1821"/><circle cx="-5" cy="-98" r="3" fill="#fff" stroke="#2c1821" stroke-width="1.6"/><circle cx="5" cy="-98" r="3" fill="#fff" stroke="#2c1821" stroke-width="1.6"/><ellipse cx="0" cy="-87" rx="3" ry="4" fill="#2c1821"/></g>
    <g class="q2" opacity="0"><path class="ink" d="M-12-70l-14-26M12-70l14-26" stroke-width="3.5" fill="none"/><circle cx="-27" cy="-98" r="3.6" fill="#2c1821"/><circle cx="27" cy="-98" r="3.6" fill="#2c1821"/><path class="ink" d="M-9-97q3-3 6 0M3-97q3-3 6 0" stroke-width="1.8" fill="none"/><path class="ink" d="M-5-90q5 6 10 0z" stroke-width="1.6" fill="#c94a4a"/></g>
    <g class="q3" opacity="0"><path class="ink" d="M-12-70l-4 24M12-70l12-14 -6-10" stroke-width="3.5" fill="none"/><circle cx="-16" cy="-44" r="3.6" fill="#2c1821"/><circle cx="18" cy="-94" r="3.6" fill="#2c1821"/><path class="ink" d="M-9-97h6M3-97h6M-8-101l5 1M3-100l5-1M-3-88q4 2 7-1" stroke-width="1.6" fill="none"/></g>
  </g>
  <!-- frame ticker: 25 frames -->
  <g>
    <rect x="268" y="152" width="176" height="14" rx="3" fill="#0d070f" opacity=".75"/>
    <g fill="#ffffff" opacity=".22">
      <rect x="270" y="155" width="5" height="8"/><rect x="277" y="155" width="5" height="8"/><rect x="284" y="155" width="5" height="8"/><rect x="291" y="155" width="5" height="8"/><rect x="298" y="155" width="5" height="8"/><rect x="305" y="155" width="5" height="8"/>
      <rect x="312" y="155" width="5" height="8"/><rect x="319" y="155" width="5" height="8"/><rect x="326" y="155" width="5" height="8"/>
      <rect x="333" y="155" width="5" height="8"/><rect x="340" y="155" width="5" height="8"/><rect x="347" y="155" width="5" height="8"/><rect x="354" y="155" width="5" height="8"/><rect x="361" y="155" width="5" height="8"/><rect x="368" y="155" width="5" height="8"/><rect x="375" y="155" width="5" height="8"/><rect x="382" y="155" width="5" height="8"/><rect x="389" y="155" width="5" height="8"/><rect x="396" y="155" width="5" height="8"/><rect x="403" y="155" width="5" height="8"/><rect x="410" y="155" width="5" height="8"/>
      <rect x="417" y="155" width="5" height="8"/><rect x="424" y="155" width="5" height="8"/><rect x="431" y="155" width="5" height="8"/><rect x="438" y="155" width="5" height="8"/>
    </g>
    <g stroke="#ff8fc8" stroke-width="2"><path d="M311 153v12M332 153v12M416 153v12"/></g>
    <rect class="fr" x="270" y="155" width="5" height="8" fill="#ff4fa3"/>
  </g>
  <g class="sans">
    <text x="356" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#fbfaf5">Stepped poses</text>
    <text x="356" y="352" text-anchor="middle" font-size="12" fill="#bfa6b8">hold 2–15 frames, swap in</text>
    <text x="356" y="368" text-anchor="middle" font-size="12" fill="#bfa6b8">one · no tweens on bodies</text>
    <text x="356" y="384" text-anchor="middle" font-size="12" fill="#bfa6b8">mouths flip every 2–3 frames</text>
  </g>

  <!-- 3 outline -->
  <rect x="496" y="148" width="188" height="150" rx="6" fill="#ffe3ee"/>
  <g class="head">
    <circle class="ol" cx="590" cy="214" r="46" fill="#fbfaf5" stroke="#2c1821" stroke-width="3"/>
    <circle cx="574" cy="210" r="5" fill="#2c1821"/><circle cx="606" cy="210" r="5" fill="#2c1821"/>
    <path class="ink" d="M578 230q12 9 24 0" stroke-width="3" fill="none"/>
    <path class="ink" d="M566 196l14 3M614 196l-14 3" stroke-width="2.4"/>
  </g>
  <path d="M528 276h124" stroke="#2c1821" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M544 270v12M636 270v12" stroke="#2c1821" stroke-width="1.2"/>
  <text x="590" y="292" text-anchor="middle" class="mono" font-size="10" fill="#2c1821">head ⌀</text>
  <g class="mono" font-size="12" font-weight="700" fill="#2c1821">
    <text class="w3" x="672" y="170" text-anchor="end">3 %</text>
    <text class="w5" x="672" y="170" text-anchor="end">5 %</text>
    <text class="w7" x="672" y="170" text-anchor="end">7 %</text>
  </g>
  <rect x="506" y="158" width="14" height="14" rx="3" fill="#2c1821"/>
  <rect x="524" y="158" width="14" height="14" rx="3" fill="#301b25"/>
  <text x="543" y="169" class="mono" font-size="10" fill="#2c1821">#2c1821</text>
  <g class="sans">
    <text x="590" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#fbfaf5">Plum ink outline</text>
    <text x="590" y="352" text-anchor="middle" font-size="12" fill="#bfa6b8">not black · 3–7 % of head</text>
    <text x="590" y="368" text-anchor="middle" font-size="12" fill="#bfa6b8">inverted-hull shader</text>
    <text x="590" y="384" text-anchor="middle" font-size="12" fill="#bfa6b8">characters only, world has none</text>
  </g>

  <!-- 4 captions -->
  <rect x="784" y="134" width="96" height="162" rx="13" fill="#0b060b" stroke="#5a3150" stroke-width="1.5"/>
  <g clip-path="url(#scr)">
    <g class="ph">
      <rect x="780" y="130" width="104" height="170" fill="#e5188c"/>
      <rect x="780" y="250" width="104" height="50" fill="#f4cadc"/>
      <use href="#guy" xlink:href="#guy" transform="translate(832 292) scale(.82)"/>
      <g transform="translate(832 292) scale(.82)"><path class="ink" d="M-12-70l-6 22M12-70l6 22" stroke-width="3.5" fill="none"/><circle cx="-18" cy="-46" r="3.6" fill="#2c1821"/><circle cx="18" cy="-46" r="3.6" fill="#2c1821"/><path class="ink" d="M-9-97h6M3-97h6M-3-88q4 2 7-1" stroke-width="1.8" fill="none"/></g>
    </g>
    <g text-anchor="middle" font-size="12.5">
      <text class="cap c c0" x="832" y="249" stroke-width="4">THIS WALL</text>
      <text class="cap c c1" x="832" y="249" stroke-width="4">IS THE</text>
      <text class="cap c c2" x="832" y="249" stroke-width="4">WRONG</text>
      <text class="cap c c3" x="832" y="249" stroke-width="4">PINK.</text>
      <text class="cap c c4" x="832" y="249" stroke-width="4">EXACTLY!</text>
      <text class="cap c c5" x="832" y="249" stroke-width="4">SO HE</text>
      <text class="cap c c6" x="832" y="249" stroke-width="4">WALKED</text>
      <text class="cap c c7" x="832" y="249" stroke-width="4">OUTSIDE.</text>
    </g>
  </g>
  <path d="M884 245h22" stroke="#ff8fc8" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="908" y="249" class="mono" font-size="10.5" fill="#ff8fc8">70%</text>
  <g class="sans">
    <text x="824" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#fbfaf5">Captions</text>
    <text x="824" y="352" text-anchor="middle" font-size="12" fill="#bfa6b8">1–3 words a card, mostly 1</text>
    <text x="824" y="368" text-anchor="middle" font-size="12" fill="#bfa6b8">white, black stroke, 70 %</text>
    <text x="824" y="384" text-anchor="middle" font-size="12" fill="#bfa6b8">height · hard swap</text>
  </g>

  <!-- 5 mix -->
  <rect x="964" y="148" width="208" height="150" rx="6" fill="#120914"/>
  <path d="M972 174h192M972 216h192M972 262h192" stroke="#2c1a33" stroke-width="1"/>
  <text x="972" y="166" class="mono" font-size="9.5" fill="#ff8fc8">VOICE −14 LUFS</text>
  <g class="v" fill="#ff4fa3">
    <rect x="974" y="178" width="5" height="32" rx="2"/><rect x="982" y="182" width="5" height="24" rx="2" style="animation-delay:-.3s"/><rect x="990" y="176" width="5" height="36" rx="2" style="animation-delay:-.6s"/><rect x="998" y="184" width="5" height="20" rx="2" style="animation-delay:-.15s"/>
    <rect x="1006" y="178" width="5" height="32" rx="2" style="animation-delay:-.45s"/><rect x="1014" y="186" width="5" height="16" rx="2" style="animation-delay:-.7s"/><rect x="1022" y="176" width="5" height="36" rx="2" style="animation-delay:-.2s"/><rect x="1030" y="180" width="5" height="28" rx="2" style="animation-delay:-.55s"/>
    <rect x="1038" y="184" width="5" height="20" rx="2" style="animation-delay:-.35s"/><rect x="1046" y="176" width="5" height="36" rx="2" style="animation-delay:-.8s"/><rect x="1054" y="180" width="5" height="28" rx="2" style="animation-delay:-.1s"/><rect x="1062" y="186" width="5" height="16" rx="2" style="animation-delay:-.65s"/>
    <rect x="1070" y="178" width="5" height="32" rx="2" style="animation-delay:-.4s"/><rect x="1078" y="182" width="5" height="24" rx="2" style="animation-delay:-.25s"/><rect x="1086" y="176" width="5" height="36" rx="2" style="animation-delay:-.75s"/><rect x="1094" y="184" width="5" height="20" rx="2" style="animation-delay:-.5s"/>
    <rect x="1102" y="180" width="5" height="28" rx="2" style="animation-delay:-.05s"/><rect x="1110" y="176" width="5" height="36" rx="2" style="animation-delay:-.6s"/><rect x="1118" y="182" width="5" height="24" rx="2" style="animation-delay:-.3s"/><rect x="1126" y="186" width="5" height="16" rx="2" style="animation-delay:-.85s"/>
    <rect x="1134" y="178" width="5" height="32" rx="2" style="animation-delay:-.2s"/><rect x="1142" y="180" width="5" height="28" rx="2" style="animation-delay:-.45s"/><rect x="1150" y="176" width="5" height="36" rx="2" style="animation-delay:-.7s"/><rect x="1158" y="184" width="5" height="20" rx="2" style="animation-delay:-.15s"/>
  </g>
  <text x="972" y="230" class="mono" font-size="9.5" fill="#7fe0c4">MUSIC 22–25 dB UNDER</text>
  <g class="m" fill="#2f9e83">
    <rect x="974" y="238" width="190" height="8" rx="4"/>
  </g>
  <text x="972" y="276" class="mono" font-size="9.5" fill="#ffd27a">SFX 3–6 HITS / 10 s</text>
  <g fill="#ffd27a">
    <rect class="hit" x="1000" y="262" width="6" height="30" rx="2" style="animation-delay:-.2s"/>
    <rect class="hit" x="1062" y="262" width="6" height="30" rx="2" style="animation-delay:-1.1s"/>
    <rect class="hit" x="1120" y="262" width="6" height="30" rx="2" style="animation-delay:-1.7s"/>
  </g>
  <rect class="scan" x="972" y="154" width="1.5" height="140" fill="#fff" opacity=".6"/>
  <g class="sans">
    <text x="1068" y="330" text-anchor="middle" font-size="15" font-weight="800" fill="#fbfaf5">The mix</text>
    <text x="1068" y="352" text-anchor="middle" font-size="12" fill="#bfa6b8">your voice on top, music all</text>
    <text x="1068" y="368" text-anchor="middle" font-size="12" fill="#bfa6b8">the way, no ducking · final</text>
    <text x="1068" y="384" text-anchor="middle" font-size="12" fill="#bfa6b8">−14 LUFS, peak ≤ −1 dBTP</text>
  </g>
</svg>
