<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
<script type="importmap">
{ "imports": { "three": "/outline-shader/node_modules/three/build/three.module.js", "three/addons/": "/outline-shader/node_modules/three/examples/jsm/" } }
</script></head>
<body><canvas id="gl" width="1080" height="1920"></canvas>
<script type="module">
  import { createTechniques } from './techniques.js';
  const q = new URLSearchParams(location.search);
  try {
    const demo = createTechniques({ canvas: document.getElementById('gl'), motionBlur: q.get('mb') === '1', dof: q.get('dof') !== '0' });
    window.demo = demo;
    await demo.ready;
    demo.renderAt(1);
    window.demoReady = true;
  } catch (e) { window.demoError = String(e.stack || e); }
</script></body></html>
