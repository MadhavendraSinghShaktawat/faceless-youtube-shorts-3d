<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  #stage { position: relative; width: 1080px; height: 1920px; }
  canvas#gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
  #caption { position: absolute; left: 0; right: 0; top: 74%; transform: translateY(-50%); text-align: center;
    font: 900 68px "Arial Black", "Helvetica Neue", Arial, sans-serif; color: #fff; -webkit-text-stroke: 14px #15101c; paint-order: stroke fill; }
  #caption span { display: inline-block; margin: 0 8px; }
  #caption span.on { color: #ffd23f; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl" width="1080" height="1920"></canvas><div id="caption"></div></div>
<script type="module" src="./bundle.js"></script>
</body>
</html>
