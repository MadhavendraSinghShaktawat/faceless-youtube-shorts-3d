<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      #gl { position: absolute; inset: 0; width: 1080px; height: 1920px; display: block; }
      #caption { position: absolute; left: 0; right: 0; top: 74%; transform: translateY(-50%); text-align: center;
        font: 900 68px "Arial Black", "Helvetica Neue", Arial, sans-serif; color: #fff; -webkit-text-stroke: 14px #15101c; paint-order: stroke fill; }
      #caption span { display: inline-block; margin: 0 8px; }
      #caption span.on { color: #ffd23f; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="5" data-fps="30" data-width="1080" data-height="1920" data-no-timeline>
      <canvas id="gl" class="clip" data-start="0" data-duration="5" data-track-index="0" width="1080" height="1920"></canvas>
      <div id="caption" class="clip" data-start="0" data-duration="5" data-track-index="1"></div>
      <audio id="music" src="assets/music.wav" data-start="0" data-duration="5" data-track-index="2" data-volume="0.8" data-fade-out="0.3" data-automation="{&quot;version&quot;: 1, &quot;lanes&quot;: [{&quot;target&quot;: &quot;volume&quot;, &quot;points&quot;: [{&quot;t&quot;: 0, &quot;v&quot;: 1}, {&quot;t&quot;: 0.4, &quot;v&quot;: 1}, {&quot;t&quot;: 0.6, &quot;v&quot;: 0.25}, {&quot;t&quot;: 3.2, &quot;v&quot;: 0.25}, {&quot;t&quot;: 3.6, &quot;v&quot;: 1}]}]}"></audio>
      <audio id="vo" src="assets/vo.wav" data-start="0.6" data-track-index="3" data-volume="1"></audio>
      <audio id="sfx" src="assets/sfx.wav" data-start="3.8" data-track-index="4" data-volume="0.9"></audio>
    </div>
    <script src="./bundle.js"></script>
  </body>
</html>
