<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block;width:1080px;height:1920px}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<canvas id="gl" width="1080" height="1920"></canvas>
<script type="module">
  import { createDemo } from './demo.js';
  const variant = new URLSearchParams(location.search).get('variant') ?? 'hull';
  const demo = createDemo({ canvas: document.getElementById('gl'), variant });
  window.demo = demo;
  demo.ready.then(() => { demo.renderAt(1); window.demoReady = true; }).catch((e) => { window.demoError = String(e.stack || e); });
</script>
</body>
</html>
